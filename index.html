<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Off Carrom">
<meta name="theme-color" content="#120c06">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon-48.png">
<meta name="description" content="Off Carrom: an offline landscape arcade pool game. Career, tournament and quick match: 8-ball, 9-ball, UK 8-ball and more.">
<meta property="og:title" content="Off Carrom"><meta property="og:description" content="An offline landscape arcade pool game.">
<meta property="og:image" content="./icons/icon-512.png">
<title>OFF CARROM</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #120c06; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* #wrap is the stage: sized (and, for a touch device held in portrait, rotated 90 degrees) by main.ts so the game is always landscape */
  #wrap { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; background: #120c06; transform-origin: 0 0; }
  canvas { position: absolute; display: block; background: #120c06; outline: none; touch-action: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0"></canvas></div>
<script type="module">
  import { start } from './src/main.ts';
  start(document.getElementById('game'), document.getElementById('wrap'));
</script>
</body>
</html>
